default:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv_cache"
  PRE_COMMIT_HOME: "$CI_PROJECT_DIR/.cache/pre-commit"

cache:
  key:
    files:
      - uv.lock
      - .pre-commit-config.yaml
  paths:
    - .uv_cache/
    - .cache/pre-commit

stages:
  - lint
  - test
  - release

.rules-push-and-mr:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

.rules-tag-only:
  rules:
    - if: $CI_COMMIT_TAG

pre-commit:
  stage: lint
  extends: .rules-push-and-mr
  before_script:
    - apt-get update && apt-get install -y git
    - uv sync --frozen
  script:
    - uv run pre-commit run --all-files

test:
  stage: test
  extends: .rules-push-and-mr
  variables:
    PURLWATCH_HASH_KEY: "test-key-in-ci"
  script:
    - uv sync --all-packages --frozen
    - uv run pytest --record-mode=none --cov=purlwatch_core

check-signoff:
  stage: lint
  variables:
    GIT_DEPTH: 0
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apt-get update && apt-get install -y git
  script:
    - python scripts/check_signoff.py

build:
  stage: release
  extends: .rules-tag-only
  script:
    - uv build --all-packages
  artifacts:
    paths:
      - dist/
      - packages/*/dist/