[project]
name = "purlwatch-cli"
version = "0.1.0"
description = "Cli..."
requires-python = ">=3.12"
authors = [{ name = "Tesla Technologies & Software S.L." }]

dependencies = [
    "purlwatch-core",
    "purlwatch-collectors"
]

[project.urls]
Repository = "https://github.com/tesla-technologies/PurlWatch"

[project.scripts]
purlwatch = "purlwatch_cli.resolve:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
purlwatch-core = { workspace = true }
purlwatch-collectors = { workspace = true }