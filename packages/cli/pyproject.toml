[project]
name = "auratrace-cli"
version = "0.1.0"
description = "Cli..."
requires-python = ">=3.12"
authors = [{ name = "Tesla Technologies & Software S.L." }]

dependencies = [
    "auratrace-core",
    "auratrace-collectors"
]

[project.scripts]
auratrace = "auratrace_cli.resolve:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
auratrace-core = { workspace = true }
auratrace-collectors = { workspace = true }